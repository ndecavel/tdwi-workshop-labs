name: notebooks

on:
  push:
    paths:
      - "Labs/**"
      - "tools/**"
      - ".github/workflows/notebooks.yml"
  pull_request:
    paths:
      - "Labs/**"
      - "tools/**"
      - ".github/workflows/notebooks.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Notebooks are stripped and clean
        run: python tools/check_notebooks.py
      - name: Behr and Benefits twins match
        run: python tools/check_twins.py
